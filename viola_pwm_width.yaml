esphome:
  name: viola-pwm-width
  friendly_name: VIOLA PWM-Pulsbreite

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "VIOLA PWM Pulsbreite Fallback"
    password: "viola-width-test"

captive_portal:

# GPIO4 is connected to the midpoint of the 10 kOhm / 20 kOhm divider.
# This configuration measures only the HIGH pulse width.
sensor:
  - platform: pulse_width
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: false
        pulldown: false
    name: "VIOLA U7 PWM HIGH-Pulsbreite"
    id: viola_u7_high_width
    unit_of_measurement: "us"
    accuracy_decimals: 2
    update_interval: 1s
    filters:
      - multiply: 1000000.0
    on_value:
      then:
        - logger.log:
            format: "VIOLA U7 HIGH-Pulsbreite: %.2f us"
            args: ["x"]
