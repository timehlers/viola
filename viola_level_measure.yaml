esphome:
  name: viola-level-measure
  friendly_name: VIOLA Pegelmessung

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "VIOLA Pegelmessung Fallback"
    password: "viola-level-test"

captive_portal:

sensor:
  - platform: adc
    pin: GPIO4
    name: "VIOLA GPIO4 Maximalpegel"
    id: viola_gpio4_max
    attenuation: 11dB
    samples: 64
    sampling_mode: max
    update_interval: 100ms
    unit_of_measurement: "V"
    accuracy_decimals: 3
    on_value:
      then:
        - logger.log:
            format: "VIOLA GPIO4 ADC-Maximalpegel: %.3f V"
            args: ["x"]
