esphome:
  name: viola-pwm-rmt
  friendly_name: VIOLA PWM RMT-Messung

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "VIOLA PWM RMT Fallback"
    password: "viola-rmt-test"

captive_portal:

# GPIO4 is connected to the midpoint of the existing 10 kOhm / 20 kOhm
# divider. This component only measures; it never drives the lamp signal.
remote_receiver:
  pin:
    number: GPIO4
    mode:
      input: true
      pullup: false
      pulldown: false
  dump: raw
  tolerance: 20%
  filter: 1us
  idle: 200us
