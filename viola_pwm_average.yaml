esphome:
  name: viola-pwm-average
  friendly_name: VIOLA PWM-Mittelwert

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "VIOLA PWM Mittelwert Fallback"
    password: "viola-average-test"

captive_portal:

# GPIO4 is connected to the midpoint of the 10 kOhm / 20 kOhm divider.
# This measures the average level of the fast switching signal.
sensor:
  - platform: adc
    pin: GPIO4
    name: "VIOLA GPIO4 PWM-Mittelwert"
    id: viola_gpio4_average
    attenuation: 11dB
    samples: 64
    sampling_mode: avg
    update_interval: 500ms
    unit_of_measurement: "V"
    accuracy_decimals: 3
    on_value:
      then:
        - logger.log:
            format: "VIOLA GPIO4 PWM-Mittelwert: %.3f V"
            args: ["x"]
