esphome:
  name: viola-jieli-switch-test
  friendly_name: VIOLA Jieli-Schalter Test
  on_boot:
    priority: 800
    then:
      - switch.turn_off: jieli_power

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "VIOLA Jieli Switch Fallback"
    password: "viola-jieli-test"

captive_portal:

switch:
  - platform: gpio
    name: "VIOLA Jieli Versorgung"
    id: jieli_power
    pin:
      number: GPIO0
      mode:
        output: true
    restore_mode: ALWAYS_OFF
    inverted: false
